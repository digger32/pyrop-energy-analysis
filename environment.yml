name: pyrop
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - matplotlib>=3.7
  - seaborn>=0.12
  - openpyxl>=3.1
  - xlrd>=2.0
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - pytest>=7.0
  - pip
  - pip:
    - xgboost>=2.0
    - catboost>=1.2
    - lightgbm>=4.0
    - shap>=0.45
    - -e .
